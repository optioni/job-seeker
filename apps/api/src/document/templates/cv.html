<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{firstName}} {{lastName}} — CV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 11pt;
            line-height: 1.5;
            color: #222;
            background: #fff;
            padding: 40px 48px;
            max-width: 820px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            border-bottom: 2px solid #1a365d;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 26pt;
            font-weight: 700;
            color: #1a365d;
            letter-spacing: -0.5px;
        }

        .contact-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
            margin-top: 8px;
            font-size: 9.5pt;
            color: #444;
            font-family: 'Arial', sans-serif;
        }

        .contact-row a {
            color: #2b6cb0;
            text-decoration: none;
        }

        .contact-row span::before {
            content: '';
        }

        /* Sections */
        .section {
            margin-bottom: 22px;
        }

        .section-title {
            font-size: 12pt;
            font-weight: 700;
            color: #1a365d;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #bee3f8;
            padding-bottom: 4px;
            margin-bottom: 12px;
            font-family: 'Arial', sans-serif;
        }

        /* Summary */
        .summary-text {
            font-size: 10.5pt;
            color: #333;
        }

        /* Work Experience */
        .entry {
            margin-bottom: 14px;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px;
        }

        .entry-header .title-company {
            font-size: 10.5pt;
            font-weight: 700;
            color: #1a202c;
        }

        .entry-header .dates {
            font-size: 9.5pt;
            color: #718096;
            font-family: 'Arial', sans-serif;
            white-space: nowrap;
        }

        .entry p {
            font-size: 10pt;
            color: #444;
            margin-top: 4px;
        }

        .entry ul {
            margin-top: 4px;
            padding-left: 18px;
        }

        .entry ul li {
            font-size: 10pt;
            color: #444;
            margin-bottom: 2px;
        }

        /* Education */
        .education-entry {
            margin-bottom: 10px;
        }

        .education-entry .degree {
            font-weight: 700;
            font-size: 10.5pt;
        }

        .education-entry .institution {
            font-size: 10pt;
            color: #555;
        }

        .education-entry .dates {
            font-size: 9.5pt;
            color: #718096;
            font-family: 'Arial', sans-serif;
        }

        /* Skills & Languages */
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .skill {
            display: inline-block;
            background: #ebf8ff;
            color: #2b6cb0;
            border: 1px solid #bee3f8;
            border-radius: 3px;
            padding: 2px 8px;
            font-size: 9.5pt;
            font-family: 'Arial', sans-serif;
        }

        /* Certifications */
        .cert-entry {
            margin-bottom: 6px;
            font-size: 10pt;
        }

        /* Projects */
        .project-entry {
            margin-bottom: 14px;
        }

        .project-entry .project-name {
            font-weight: 700;
            font-size: 10.5pt;
        }

        .project-entry a {
            color: #2b6cb0;
            text-decoration: none;
            font-size: 9.5pt;
        }

        .project-entry p {
            font-size: 10pt;
            color: #444;
            margin-top: 3px;
        }

        .project-entry .tech {
            font-size: 9.5pt;
            color: #718096;
            font-style: italic;
            margin-top: 2px;
        }

        /* Utility */
        .hidden {
            display: none;
        }

        @media print {
            body {
                padding: 20px 32px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>{{firstName}} {{lastName}}</h1>
        <div class="contact-row">
            <span>{{email}}</span>
            <span>{{phone}}</span>
            <span>{{location}}</span>
            <span>{{linkedIn}}</span>
            <span>{{github}}</span>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Summary</div>
        <p class="summary-text">{{summary}}</p>
    </div>

    <div class="section">
        <div class="section-title">Work Experience</div>
        {{workExperiencesHtml}}
    </div>

    <div class="section">
        <div class="section-title">Education</div>
        {{educationsHtml}}
    </div>

    <div class="section">
        <div class="section-title">Skills</div>
        <div class="tags">
            {{skillsHtml}}
        </div>
    </div>

    <div class="section">
        <div class="section-title">Languages</div>
        <div class="tags">
            {{languagesHtml}}
        </div>
    </div>

    <div class="section">
        <div class="section-title">Certifications</div>
        {{certificationsHtml}}
    </div>

    <div class="section">
        <div class="section-title">Projects</div>
        {{projectsHtml}}
    </div>

</body>
</html>
