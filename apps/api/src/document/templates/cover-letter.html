<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Letter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 11pt;
            line-height: 1.7;
            color: #222;
            background: #fff;
            padding: 60px 64px;
            max-width: 820px;
            margin: 0 auto;
        }

        .letter-body {
            white-space: pre-wrap;
            font-size: 11pt;
            color: #333;
        }

        @media print {
            body {
                padding: 40px 48px;
            }
        }
    </style>
</head>
<body>

    <div class="letter-body">{{coverLetterText}}</div>

</body>
</html>
