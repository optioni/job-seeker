services:
    postgres:
        image: postgres:16-alpine
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        environment:
            POSTGRES_DB: job_seeker
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        networks:
            - app-network

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        networks:
            - app-network

    gotenberg:
        image: gotenberg/gotenberg:8
        networks:
            - app-network

    api:
        build:
            context: .
            dockerfile: docker/api.Dockerfile
        ports:
            - "3000:3000"
        depends_on:
            - postgres
            - redis
            - gotenberg
        env_file: .env
        environment:
            GOTENBERG_URL: http://gotenberg:3000
        networks:
            - app-network

    web:
        build:
            context: .
            dockerfile: docker/web.Dockerfile
        ports:
            - "3001:3001"
        depends_on:
            - api
        env_file: .env
        networks:
            - app-network

networks:
    app-network:

volumes:
    pgdata:
